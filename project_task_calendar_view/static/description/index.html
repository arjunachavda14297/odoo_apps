<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Calendar View Customization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 1rem 2rem;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #333;
        }

        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px;
            padding-bottom: : 15px;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="padding-top: 20px;">Task Calendar View With Project Name</h1>
    </header>

    <div class="container">
        <h2>Feature Overview</h2>
        <p>This customization enhances the 'Show Project Name' functionality in Odoo 17 by displaying the corresponding project name below the task name in the calendar view of tasks.</p>

        <h2><u>Task Calendar View</u></h2>
        <img src="images/project_task_calendar_view.png" alt="Task Calendar View">

    </div>

    <footer>
        <p>&copy; 2024 Arionyx Solutions</p>
    </footer>
</body>
</html>
